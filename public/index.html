<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.png">
  <title>Agora Market</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; background: #f7f8f5; color: #17251d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 100% 0, #e4f1e5, transparent 38%), #f7f8f5; }
    main { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 28px; }
    .shell { width: min(100%, 480px); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
    .brand img { width: 42px; height: 42px; object-fit: contain; }
    .panel { margin-top: 44px; border: 1px solid #d9e3d9; border-radius: 24px; background: rgba(255,255,255,.88); padding: 28px; box-shadow: 0 24px 60px rgba(23,59,43,.12); }
    .eyebrow { color: #397253; font: 700 11px/1.2 Arial,sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(34px, 9vw, 52px); line-height: .98; letter-spacing: -.03em; }
    p { color: #637168; font: 15px/1.6 Arial,sans-serif; }
    .actions { display: grid; gap: 10px; margin-top: 24px; }
    a, button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; border: 0; border-radius: 14px; padding: 0 16px; font: 700 14px Arial,sans-serif; text-decoration: none; cursor: pointer; }
    .primary { background: #173b2b; color: white; }
    .secondary { border: 1px solid #d9e3d9; background: white; color: #173b2b; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; color: #8b5f17; font: 700 12px Arial,sans-serif; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d99b2b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="shell">
      <div class="brand"><img src="/agora-logo.png" alt="Agora logo"><span>Agora</span></div>
      <section class="panel" aria-live="polite">
        <div class="eyebrow" id="eyebrow">Marketplace shell</div>
        <h1 id="title">Opening Agora</h1>
        <p id="message">Checking your connection and preparing your marketplace.</p>
        <div class="status" id="status"><span class="dot"></span><span>Connecting securely</span></div>
        <div class="actions hidden" id="actions">
              <button class="primary" type="button" onclick="checkLive()">Try again</button>
          <button class="secondary" type="button" onclick="location.reload()">Refresh app</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    const liveUrl = 'https://agora-market-7s2m.vercel.app/';
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const eyebrow = document.getElementById('eyebrow');
    const status = document.getElementById('status');
    const actions = document.getElementById('actions');
    const checkLive = () => location.replace(liveUrl);
    // Let the native WebView decide whether the main frame loaded. Its error
    // handler returns to offline.html without trusting navigator.onLine.
    window.setTimeout(checkLive, 150);
  </script>
</body>
</html>
